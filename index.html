<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Pass : Pack-Free Bot</title>
    <style>
        /* 완전한 하늘색(Sky Blue) 모노톤 테마 */
        body {
            background-color: #e1f5fe; /* 아주 연한 하늘색 배경 */
            color: #0277bd; /* 기본 텍스트 (너무 진하지 않은 맑은 파란색) */
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .kiosk-container {
            width: 90%;
            max-width: 900px;
            background-color: #ffffff; /* 기기 배경은 깨끗한 흰색 */
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 15px 35px rgba(3, 169, 244, 0.15); /* 하늘색 그림자 */
            text-align: center;
            position: relative;
            border: 3px solid #b3e5fc; /* 연한 하늘색 테두리 */
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .title-text {
            font-size: 38px;
            font-weight: bold;
            color: #0288d1; /* 포인트 하늘색 */
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .sub-text {
            font-size: 24px;
            color: #039be5; /* 중간톤 하늘색 */
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* 1. 시작 버튼 */
        .start-btn {
            background-color: #29b6f6; /* 부드러운 하늘색 */
            color: white;
            border: none;
            padding: 25px 60px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(41, 182, 246, 0.3);
        }
        .start-btn:hover { background-color: #03a9f4; transform: scale(1.05); }

        /* 2. 항공사 버튼 그리드 */
        .airline-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .airline-btn {
            background-color: #ffffff;
            border: 2px solid #4fc3f7; /* 밝은 하늘색 테두리 */
            border-radius: 12px;
            padding: 20px 30px;
            font-size: 22px;
            font-weight: bold;
            color: #0288d1;
            cursor: pointer;
            width: 200px;
            transition: 0.2s;
        }
        .airline-btn:hover { background-color: #e1f5fe; border-color: #03a9f4; }

        /* 3. 카메라 (바코드 스캐너) 영역 */
        .camera-container {
            position: relative;
            width: 300px;
            height: 200px;
            margin: 0 auto;
            background-color: #e1f5fe; /* 카메라가 안 켜졌을 때도 하늘색 */
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid #81d4fa;
        }
        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .viewfinder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 60%;
            border: 2px dashed #ffffff;
            pointer-events: none;
        }
        .camera-guide {
            position: absolute;
            bottom: 10px;
            width: 100%;
            color: #0288d1;
            font-size: 16px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 0;
            z-index: 2;
        }

        /* 배터리 테스트 버튼 (모두 하늘색 톤으로 통일) */
        .test-btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .test-btn {
            background-color: #4fc3f7; /* 연한 하늘색 */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(79, 195, 247, 0.3);
            transition: 0.2s;
        }
        .test-btn:hover { background-color: #29b6f6; }
        
        .test-btn.fail { 
            background-color: #81d4fa; /* 버튼 구분을 위해 살짝 더 연한 하늘색 */
        }
        .test-btn.fail:hover { background-color: #4fc3f7; }

        .selected-airline-label {
            display: inline-block;
            background-color: #e1f5fe;
            color: #0288d1;
            border: 2px solid #81d4fa;
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* 로딩 스피너 */
        .spinner {
            width: 70px;
            height: 70px;
            border: 7px solid #e1f5fe;
            border-top: 7px solid #29b6f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 결과 화면 박스 (초록, 빨강 제거하고 하늘색으로 통일) */
        .result-box {
            background: #f4fcff;
            padding: 40px 30px;
            border-radius: 15px;
            margin-bottom: 40px;
            border: 3px solid #81d4fa; /* 동일한 하늘색 테두리 */
        }
        
        .action-info {
            color: #4fc3f7;
            font-size: 20px;
            margin-top: 20px;
            display: block;
        }

        .home-btn, .consignment-btn {
            background-color: white;
            color: #0288d1;
            border: 2px solid #4fc3f7;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .consignment-btn {
            background-color: #29b6f6; /* 위탁서비스 버튼도 하늘색 테마 */
            color: white;
            border: none;
            box-shadow: 0 5px 15px rgba(41, 182, 246, 0.3);
        }
        .consignment-btn:hover { background-color: #03a9f4; }
        .home-btn:hover { background-color: #e1f5fe; }
    </style>
</head>
<body>

    <div class="kiosk-container">

        <!-- [화면 1] 인사말 및 시작 -->
        <div id="screen-welcome" class="screen active">
            <div class="title-text">안녕하세요.<br>보조배터리 반입 확인 로봇입니다.</div>
            <button class="start-btn" onclick="showScreen('screen-airline')">시작하기</button>
        </div>

        <!-- [화면 2] 항공사 선택 및 바코드 인식(카메라) -->
        <div id="screen-airline" class="screen">
            <div class="title-text" style="font-size: 32px;">항공사 선택하기 또는<br>아래 바코드 인식란에 티켓을 인식해주세요.</div>
            
            <div class="airline-grid">
                <button class="airline-btn" onclick="selectAirline('대한항공')">대한항공</button>
                <button class="airline-btn" onclick="selectAirline('아시아나항공')">아시아나항공</button>
                <button class="airline-btn" onclick="selectAirline('제주항공')">제주항공</button>
                <button class="airline-btn" onclick="selectAirline('진에어')">진에어</button>
            </div>

            <!-- 카메라 바코드 스캔 영역 -->
            <div class="camera-container">
                <video id="camera-feed" autoplay playsinline></video>
                <div class="viewfinder"></div>
                <div class="camera-guide">이곳에 탑승권 바코드를 비춰주세요</div>
            </div>
        </div>

        <!-- [화면 3] 배터리 올리기 -->
        <div id="screen-battery" class="screen">
            <div class="selected-airline-label" id="display-airline">OO항공</div>
            <div class="title-text" style="font-size: 42px;">아래에 보조배터리를 올려주세요.</div>
            
            <!-- 시연용 컨트롤 버튼 (모두 하늘색 계열) -->
            <div class="test-btn-group">
                <button class="test-btn" onclick="startScan(true)">테스트: 규정 맞음(합격)</button>
                <button class="test-btn fail" onclick="startScan(false)">테스트: 규정 초과(불합격)</button>
            </div>
        </div>

        <!-- [화면 4] 판독 로딩 -->
        <div id="screen-loading" class="screen">
            <div class="spinner"></div>
            <div class="title-text">배터리 규정을 확인하고 있습니다...</div>
        </div>

        <!-- [화면 5] 결과: 합격 (규정 맞음) -->
        <div id="screen-pass" class="screen">
            <div class="result-box">
                <div class="title-text">이 배터리는 규정에 맞습니다.</div>
                <div class="sub-text" style="margin-bottom: 0;">
                    디지털 검증패스 QR을 배터리에 붙여주시고<br>지퍼백에 넣어주세요.
                </div>
                <span class="action-info">(기기에서 지퍼백과 QR 스티커 배출 중...)</span>
            </div>
            <button class="home-btn" onclick="showScreen('screen-welcome')">처음으로 돌아가기</button>
        </div>

        <!-- [화면 6] 결과: 불합격 (위탁 서비스 유도) -->
        <div id="screen-fail" class="screen">
            <div class="result-box">
                <div class="title-text">이 배터리는 기내에 반입할 수 없습니다.</div>
                <div class="sub-text" style="margin-bottom: 0;">
                    보관함이나 위탁서비스를 이용해주세요.
                </div>
            </div>
            <!-- 위탁서비스 이용하기 버튼 -->
            <button class="consignment-btn" onclick="goToConsignment()">위탁서비스 이용하기</button>
        </div>

    </div>

    <script>
        let cameraStream = null;

        // 화면 전환 함수
        function showScreen(screenId) {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => screen.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            // 화면 2(바코드 스캔) 진입 시 카메라 켜기
            if (screenId === 'screen-airline') {
                startCamera();
            } else {
                stopCamera(); 
            }
        }

        // 카메라 시작 함수
        async function startCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('camera-feed').srcObject = cameraStream;
            } catch (err) {
                console.error("카메라 접근 불가:", err);
                document.querySelector('.camera-guide').innerText = "카메라 권한을 허용해주세요.";
            }
        }

        // 카메라 종료 함수
        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
        }

        // 항공사 선택 완료 시
        function selectAirline(airlineName) {
            document.getElementById('display-airline').innerText = airlineName;
            showScreen('screen-battery');
        }

        // 배터리 올렸을 때 판독 시작
        function startScan(isPass) {
            showScreen('screen-loading');

            setTimeout(() => {
                if (isPass) {
                    showScreen('screen-pass');
                } else {
                    showScreen('screen-fail');
                }
            }, 2500);
        }

        // 위탁서비스 이용하기 버튼 기능
        function goToConsignment() {
            alert("물품 보관 및 위탁 서비스 접수 화면으로 이동합니다.");
            showScreen('screen-welcome');
        }
    </script>

</body>
</html>
