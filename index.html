<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Pass : Premium Bot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
    <style>
        :root {
            --screen: #0e121b;
            --panel: #1a2130;
            --panel-line: #2b3548;
            --text: #ffffff;
            --text-sub: #aab4c6;
            --accent: #c6e86a;
            --glow: #8fd3ff;
            --danger: #ff8a7a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { min-height: 100%; }
        body {
            background: radial-gradient(circle at 50% 30%, #ffffff 0%, #eef3f8 60%, #dbe6f2 100%);
            color: var(--text);
            font-family: 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .kiosk-container {
            width: 100%;
            max-width: 900px;
            background: var(--screen);
            border: 3px solid var(--glow);
            border-radius: 36px;
            padding: 50px 40px;
            box-shadow: 0 0 0 10px rgba(143, 211, 255, 0.18),
                        0 0 40px rgba(143, 211, 255, 0.45),
                        0 30px 60px rgba(20, 40, 70, 0.25);
            text-align: center;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeUp 0.5s ease; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .title-text {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 15px;
            line-height: 1.3;
        }
        .hl { color: var(--accent); }
        .sub-text {
            font-size: 20px;
            color: var(--text-sub);
            margin-bottom: 30px;
        }

        .airline-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
            background: var(--panel);
            border: 1px solid var(--panel-line);
            border-radius: 22px;
            padding: 20px;
        }
        .airline-btn {
            background: #ffffff;
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 14px 10px;
            font-size: 16px;
            font-weight: 700;
            color: #12304f;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.25s ease;
        }
        .airline-btn:hover {
            background: var(--accent);
            color: #0e121b;
            box-shadow: 0 0 18px rgba(198, 232, 106, 0.45);
            transform: translateY(-2px);
        }

        .camera-container {
            position: relative;
            width: 280px;
            max-width: 100%;
            height: 160px;
            margin: 0 auto;
            background: #05070c;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--panel-line);
        }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        .viewfinder {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70%; height: 50%;
            border: 2px solid var(--accent);
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(5, 7, 12, 0.55), 0 0 14px rgba(198, 232, 106, 0.5);
            pointer-events: none;
        }
        .camera-guide {
            position: absolute;
            bottom: 10px;
            width: 100%;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            z-index: 2;
        }

        .test-btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        .test-btn {
            background: var(--panel);
            color: var(--text);
