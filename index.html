<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Pass : Premium Bot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
    <style>
        :root {
            --screen: #0e121b;
            --panel: #1a2130;
            --panel-line: #2b3548;
            --text: #ffffff;
            --text-sub: #aab4c6;
            --accent: #c6e86a;
            --glow: #8fd3ff;
            --danger: #ff8a7a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { min-height: 100%; }
        body {
            background: radial-gradient(circle at 50% 30%, #ffffff 0%, #eef3f8 60%, #dbe6f2 100%);
            color: var(--text);
            font-family: 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .kiosk-container {
            width: 100%;
            max-width: 900px;
            background: var(--screen);
            border: 3px solid var(--glow);
            border-radius: 36px;
            padding: 50px 40px;
            box-shadow: 0 0 0 10px rgba(143, 211, 255, 0.18),
                        0 0 40px rgba(143, 211, 255, 0.45),
                        0 30px 60px rgba(20, 40, 70, 0.25);
            text-align: center;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeUp 0.5s ease; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .title-text {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 15px;
            line-height: 1.3;
        }
        .hl { color: var(--accent); }
        .sub-text {
            font-size: 22px;
            color: var(--text-sub);
            margin-bottom: 35px;
        }

        .airline-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            background: var(--panel);
            border: 1px solid var(--panel-line);
            border-radius: 22px;
            padding: 22px;
        }
        .airline-btn {
            background: #ffffff;
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 18px 20px;
            font-size: 20px;
            font-weight: 700;
            color: #12304f;
            cursor: pointer;
            width: calc(50% - 8px);
            max-width: 200px;
            font-family: inherit;
            transition: all 0.25s ease;
        }
        .airline-btn:hover {
            background: var(--accent);
            color: #0e121b;
            box-shadow: 0 0 22px rgba(198, 232, 106, 0.45);
            transform: translateY(-2px);
        }

        .camera-container {
            position: relative;
            width: 280px;
            max-width: 100%;
            height: 180px;
            margin: 0 auto;
            background: #05070c;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--panel-line);
        }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        .viewfinder {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70%; height: 50%;
            border: 2px solid var(--accent);
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(5, 7, 12, 0.55), 0 0 14px rgba(198, 232, 106, 0.5);
            pointer-events: none;
        }
        .camera-guide {
            position: absolute;
            bottom: 10px;
            width: 100%;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            z-index: 2;
        }

        .test-btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 50px;
        }
        .test-btn {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--panel-line);
            padding: 16px 30px;
            font-size: 18px;
            font-weight: 600;
            font-family: inherit;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .test-btn:hover { border-color: var(--accent); color: var(--accent); }

        .selected-airline-label {
            display: inline-block;
            background: var(--panel);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .loader {
            width: 80px; height: 80px;
            border: 4px solid rgba(143, 211, 255, 0.2);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 40px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-box {
            background: var(--panel);
            padding: 50px 40px;
            border-radius: 24px;
            margin-bottom: 40px;
            border: 1px solid var(--panel-line);
        }
        #screen-fail .title-text .hl { color: var(--danger); }
        .action-info {
            color: var(--glow);
            font-size: 18px;
            margin-top: 25px;
            display: block;
            font-weight: 500;
        }

        .action-btns {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .home-btn, .consignment-btn {
            background: transparent;
            color: var(--text);
            border: 2px solid var(--panel-line);
            padding: 18px 45px;
            font-size: 20px;
            font-weight: 700;
            font-family: inherit;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .home-btn:hover { border-color: var(--glow); color: var(--glow); }
        .consignment-btn {
            background: var(--accent);
            color: #0e121b;
            border: none;
            box-shadow: 0 0 20px rgba(198, 232, 106, 0.3);
        }
        .consignment-btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(198, 232, 106, 0.55); }

        /* 모바일 대응 */
        @media (max-width: 640px) {
            .kiosk-container { padding: 36px 20px; border-radius: 28px; }
            .title-text { font-size: 28px !important; }
            .sub-text { font-size: 16px; margin-bottom: 24px; }
            .result-box { padding: 30px 20px; }
            .home-btn, .consignment-btn { padding: 15px 30px; font-size: 17px; }
        }
    </style>
</head>
<body>

    <div class="kiosk-container">

        <!-- [화면 1] 첫 화면 -->
        <div id="screen-welcome" class="screen active">
            <div class="title-text"><span class="hl">보조배터리</span>를 올려주세요.</div>
            <div class="sub-text">항공사 선택하기 또는 아래에 티켓 바코드를 인식해주세요.</div>

            <div class="airline-grid">
                <button class="airline-btn" onclick="selectAirline('대한항공')">대한항공</button>
                <button class="airline-btn" onclick="selectAirline('아시아나항공')">아시아나항공</button>
                <button class="airline-btn" onclick="selectAirline('제주항공')">제주항공</button>
                <button class="airline-btn" onclick="selectAirline('진에어')">진에어</button>
            </div>

            <div class="camera-container">
                <video id="camera-feed" autoplay playsinline muted></video>
                <div class="viewfinder"></div>
                <div class="camera-guide" id="camera-guide">이곳에 탑승권을 비춰주세요</div>
            </div>
        </div>

        <!-- [화면 2] 배터리 스캔 대기 -->
        <div id="screen-battery" class="screen">
            <div class="selected-airline-label" id="display-airline">OO항공</div>
            <div class="title-text" style="font-size: 38px;"><span class="hl">배터리</span>를 스캔하고 있습니다.</div>
            <div class="sub-text">잠시만 기다려주세요.</div>

            <div class="test-btn-group">
                <button class="test-btn" onclick="startScan(true)">테스트: 반입 가능</button>
                <button class="test-btn" onclick="startScan(false)">테스트: 반입 불가</button>
            </div>
        </div>

        <!-- [화면 3] 판독 로딩 -->
        <div id="screen-loading" class="screen">
            <div class="loader"></div>
            <div class="title-text" style="font-size: 32px;"><span class="hl">배터리 규정</span>을 확인하고 있습니다...</div>
            <div class="sub-text">잠시만 기다려주세요.</div>
        </div>

        <!-- [화면 4] 합격 -->
        <div id="screen-pass" class="screen">
            <div class="result-box">
                <div class="title-text">이 배터리는 <span class="hl">규정에 맞습니다.</span></div>
                <div class="sub-text" style="margin-bottom: 0;">
                    스티커를 배터리에 붙여주시고<br>파우치에 넣어주세요.
                </div>
                <span class="action-info">기기 하단에서 파우치와 스티커가 배출되었습니다.<br>스티커를 충전단자에 붙이고 파우치에 보조배터리를 넣어주세요.</span>
            </div>
            <button class="home-btn" onclick="showScreen('screen-welcome')">처음으로 돌아가기</button>
        </div>

        <!-- [화면 5] 불합격 -->
        <div id="screen-fail" class="screen">
            <div class="result-box">
                <div class="title-text">이 배터리는 <span class="hl">기내에 반입할 수 없습니다.</span></div>
                <div class="sub-text" style="margin-bottom: 0;">
                    보관함이나 위탁서비스를 이용해주세요.
                </div>
            </div>
            <div class="action-btns">
                <button class="home-btn" onclick="showScreen('screen-welcome')">처음으로</button>
                <button class="consignment-btn" onclick="goToConsignment()">위탁서비스 이용하기</button>
            </div>
        </div>

    </div>

    <script>
        var cameraStream = null;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(function (s) {
                s.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');

            if (screenId === 'screen-welcome') {
                startCamera();
            } else {
                stopCamera();
            }
        }

        function startCamera() {
            var guide = document.getElementById('camera-guide');

            // HTTPS가 아니거나 카메라를 지원하지 않는 환경에서도 화면이 멈추지 않도록 처리
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                guide.innerText = "카메라를 사용할 수 없는 환경입니다.";
                return;
            }

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(function (stream) {
                    cameraStream = stream;
                    document.getElementById('camera-feed').srcObject = stream;
                    guide.innerText = "이곳에 탑승권을 비춰주세요";
                })
                .catch(function (err) {
                    console.error("카메라 접근 불가:", err);
                    guide.innerText = "카메라 권한을 허용해주세요.";
                });
        }

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(function (t) { t.stop(); });
                cameraStream = null;
            }
        }

        function selectAirline(airlineName) {
            document.getElementById('display-airline').innerText = airlineName;
            showScreen('screen-battery');
        }

        function startScan(isPass) {
            showScreen('screen-loading');
            setTimeout(function () {
                showScreen(isPass ? 'screen-pass' : 'screen-fail');
            }, 2500);
        }

        function goToConsignment() {
            alert("물품 보관 및 위탁 서비스 접수 화면으로 이동합니다.");
            showScreen('screen-welcome');
        }

        window.addEventListener('load', startCamera);
    </script>

</body>
</html>
