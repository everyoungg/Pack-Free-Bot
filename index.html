<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Pass : Premium Bot</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 진한 남색 계열의 프리미엄 그라데이션 배경 */
            background: linear-gradient(135deg, #0a1128 0%, #0c1b33 50%, #1b2a4a 100%);
            color: #e0f2fe;
            font-family: 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .kiosk-container {
            width: 90%;
            max-width: 900px;
            /* 반투명 다크 글래스모피즘 */
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 40px;
            padding: 60px 50px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 
                        inset 0 0 20px rgba(56, 189, 248, 0.05);
            text-align: center;
            position: relative;
        }

        .screen { display: none; opacity: 0; }
        .screen.active { 
            display: block; 
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .title-text {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #f8fafc;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .sub-text {
            font-size: 22px;
            font-weight: 400;
            color: #94a3b8;
            margin-bottom: 35px;
        }

        .airline-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .airline-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1.5px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 18px 30px;
            font-size: 20px;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            width: calc(50% - 15px);
            max-width: 200px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .airline-btn:hover { 
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border-color: #38bdf8;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
            transform: translateY(-2px);
        }

        .camera-container {
            position: relative;
            width: 280px;
            height: 180px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            border: 2px solid rgba(56, 189, 248, 0.3);
        }
        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .viewfinder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 50%;
            border: 2px solid rgba(56, 189, 248, 0.8);
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(10, 17, 40, 0.6);
            pointer-events: none;
        }
        .camera-guide {
            position: absolute;
            bottom: 10px;
            width: 100%;
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            z-index: 2;
        }

        .test-btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 50px;
        }
        .test-btn {
            background: rgba(30, 41, 59, 0.6);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 16px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .test-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: #38bdf8; color: #fff; }

        .selected-airline-label {
            display: inline-block;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .loader {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(56, 189, 248, 0.15);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin: 0 auto 40px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .result-box {
            background: rgba(30, 41, 59, 0.6);
            padding: 50px 40px;
            border-radius: 24px;
            margin-bottom: 40px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .action-info {
            color: #38bdf8;
            font-size: 18px;
            margin-top: 25px;
            display: block;
            opacity: 0.9;
            font-weight: 500;
        }

        .action-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .home-btn, .consignment-btn {
            background: transparent;
            color: #cbd5e1;
            border: 2px solid rgba(148, 163, 184, 0.3);
            padding: 18px 45px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .home-btn:hover { background: rgba(255, 255, 255, 0.05); border-color: #cbd5e1; color: #fff; }
        
        .consignment-btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            box-shadow: 0 10px 20px rgba(2, 132, 199, 0.4);
        }
        .consignment-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(2, 132, 199, 0.6); }
    </style>
</head>
<body>

    <div class="kiosk-container">

        <!-- [화면 1] 첫 화면: 보조배터리를 올려주세요 (항공사 선택 및 바코드 인식) -->
        <div id="screen-welcome" class="screen active">
            <div class="title-text">보조배터리를 올려주세요.</div>
            <div class="sub-text">항공사 선택하기 또는 아래에 티켓 바코드를 인식해주세요.</div>
            
            <div class="airline-grid">
                <button class="airline-btn" onclick="selectAirline('대한항공')">대한항공</button>
                <button class="airline-btn" onclick="selectAirline('아시아나항공')">아시아나항공</button>
                <button class="airline-btn" onclick="selectAirline('제주항공')">제주항공</button>
                <button class="airline-btn" onclick="selectAirline('진에어')">진에어</button>
            </div>

            <!-- 카메라 바코드 스캔 영역 -->
            <div class="camera-container">
                <video id="camera-feed" autoplay playsinline></video>
                <div class="viewfinder"></div>
                <div class="camera-guide">이곳에 탑승권을 비춰주세요</div>
            </div>
        </div>

        <!-- [화면 2] 배터리 규정 판독 대기 -->
        <div id="screen-battery" class="screen">
            <div class="selected-airline-label" id="display-airline">OO항공</div>
            <div class="title-text" style="font-size: 38px;">배터리를 스캔하고 있습니다.</div>
            <div class="sub-text">잠시만 기다려주세요.</div>
            
            <!-- 시연용 테스트 버튼 -->
            <div class="test-btn-group">
                <button class="test-btn" onclick="startScan(true)">테스트: 반입 가능</button>
                <button class="test-btn" onclick="startScan(false)">테스트: 반입 불가</button>
            </div>
        </div>

        <!-- [화면 3] 판독 로딩 -->
        <div id="screen-loading" class="screen">
            <div class="loader"></div>
            <div class="title-text" style="font-size: 32px;">배터리 규정을 확인하고 있습니다...</div>
            <div class="sub-text">잠시만 기다려주세요.</div>
        </div>

        <!-- [화면 4] 결과: 합격 (규정 맞음) - 파우치와 스티커 안내 적용 -->
        <div id="screen-pass" class="screen">
            <div class="result-box">
                <div class="title-text">이 배터리는 규정에 맞습니다.</div>
                <div class="sub-text" style="margin-bottom: 0;">
                    스티커를 배터리에 붙여주시고<br>파우치에 넣어주세요.
                </div>
                <span class="action-info">기기 하단에서 파우치와 스티커가 배출되었습니다.</span>
            </div>
            <button class="home-btn" onclick="showScreen('screen-welcome')">처음으로 돌아가기</button>
        </div>

        <!-- [화면 5] 결과: 불합격 (위탁 서비스 유도) -->
        <div id="screen-fail" class="screen">
            <div class="result-box">
                <div class="title-text">이 배터리는 기내에 반입할 수 없습니다.</div>
                <div class="sub-text" style="margin-bottom: 0;">
                    보관함이나 위탁서비스를 이용해주세요.
                </div>
            </div>
            <div class="action-btns">
                <button class="home-btn" onclick="showScreen('screen-welcome')">처음으로</button>
                <button class="consignment-btn" onclick="goToConsignment()">위탁서비스 이용하기</button>
            </div>
        </div>

    </div>

    <script>
        let cameraStream = null;

        function showScreen(screenId) {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => screen.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            if (screenId === 'screen-welcome') {
                startCamera();
            } else {
                stopCamera(); 
            }
        }

        async function startCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('camera-feed').srcObject = cameraStream;
            } catch (err) {
                console.error("카메라 접근 불가:", err);
                document.querySelector('.camera-guide').innerText = "카메라 권한을 허용해주세요.";
            }
        }

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
        }

        function selectAirline(airlineName) {
            document.getElementById('display-airline').innerText = airlineName;
            showScreen('screen-battery');
        }

        function startScan(isPass) {
            showScreen('screen-loading');

            setTimeout(() => {
                if (isPass) {
                    showScreen('screen-pass');
                } else {
                    showScreen('screen-fail');
                }
            }, 2500);
        }

        function goToConsignment() {
            alert("물품 보관 및 위탁 서비스 접수 화면으로 이동합니다.");
            showScreen('screen-welcome');
        }

        window.onload = function() {
            startCamera();
        };
    </script>

</body>
</html>
