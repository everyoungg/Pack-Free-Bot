<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Pass : Pack-Free Bot</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #090d16;
            color: #ffffff;
            font-family: 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .kiosk-container {
            width: 90%;
            max-width: 900px;
            background: #141c2e;
            border: 3px solid #22324f;
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 
                        0 0 40px rgba(52, 211, 153, 0.1);
            text-align: center;
            position: relative;
        }

        .screen { display: none; opacity: 0; }
        .screen.active { 
            display: block; 
            animation: fadeUp 0.4s ease forwards; 
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .main-title {
            font-size: 38px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        /* 항공사 및 바코드 아이콘 버튼 그리드 */
        .icon-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .icon-btn {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 110px;
            height: 110px;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn svg {
            width: 32px;
            height: 32px;
            fill: #34d399;
        }

        .icon-btn:hover { 
            background: #34d399;
            border-color: #34d399;
            color: #0f172a;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(52, 211, 153, 0.3);
        }

        .icon-btn:hover svg {
            fill: #0f172a;
        }

        /* 하단 보조배터리 거치 및 바코드 스캔 영역 */
        .battery-tray-container {
            position: relative;
            width: 320px;
            height: 140px;
            margin: 0 auto;
            background: #0f172a;
            border-radius: 14px;
            border: 2px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tray-icon {
            font-size: 32px;
        }

        .tray-guide {
            color: #34d399;
            font-size: 14px;
            font-weight: 600;
        }

        /* 시연용 테스트 버튼 */
        .test-btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 35px;
        }
        .test-btn {
            background: #1e293b;
            color: #34d399;
            border: 1.5px solid #334155;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .test-btn:hover { background: #334155; color: #ffffff; border-color: #34d399; }

        .selected-airline-label {
            display: inline-block;
            background: #1e293b;
            color: #34d399;
            border: 1px solid #334155;
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* 로딩 스피너 */
        .loader {
            width: 70px;
            height: 70px;
            border: 4px solid #1e293b;
            border-top: 4px solid #34d399;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .result-box {
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid #334155;
        }
        
        .action-info {
            color: #94a3b8;
            font-size: 16px;
            margin-top: 15px;
            display: block;
            font-weight: 500;
        }

        .action-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .home-btn, .consignment-btn {
            background: #1e293b;
            color: #ffffff;
            border: 1.5px solid #334155;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .home-btn:hover { background: #334155; }
        
        .consignment-btn {
            background: #34d399;
            color: #0f172a;
            border: none;
            box-shadow: 0 10px 20px rgba(52, 211, 153, 0.3);
        }
        .consignment-btn:hover { background: #10b981; }
    </style>
</head>
<body>

    <div class="kiosk-container">

        <!-- [화면 1] 사진 속 로봇 화면 레이아웃 (보조배터리를 올려주세요 & 항공사를 선택해주세요) -->
        <div id="screen-welcome" class="screen active">
            <div class="main-title">보조배터리를 올려주세요</div>
            <div style="font-size: 20px; color: #94a3b8; margin-bottom: 20px; font-weight: 600;">항공사를 선택해주세요</div>
            
            <div class="icon-grid">
                <button class="icon-btn" onclick="selectAirline('대한항공')">
                    <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                    <span>대한항공</span>
                </button>
                <button class="icon-btn" onclick="selectAirline('아시아나항공')">
                    <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                    <span>아시아나</span>
                </button>
                <button class="icon-btn" onclick="selectAirline('제주항공')">
                    <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                    <span>제주항공</span>
                </button>
                <button class="icon-btn" onclick="selectAirline('진에어')">
                    <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                    <span>진에어</span>
                </button>
                <button class="icon-btn" onclick="selectAirline('티켓 스캔')">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                    <span>티켓 바코드</span>
                </button>
            </div>

            <!-- 하단 보조배터리 거치 안내 영역 (손그림 대신 보조배터리 아이콘 배치) -->
            <div class="battery-tray-container">
                <div class="tray-icon">🔋</div>
                <div class="tray-guide">이곳에 보조배터리를 올려주세요</div>
            </div>
        </div>

        <!-- [화면 2] 배터리 규정 판독 대기 -->
        <div id="screen-battery" class="screen">
            <div class="selected-airline-label" id="display-airline">OO항공</div>
            <div class="main-title" style="font-size: 34px;">배터리를 스캔하고 있습니다.</div>
            
            <!-- 시연용 테스트 버튼 -->
            <div class="test-btn-group">
                <button class="test-btn" onclick="startScan(true)">테스트: 반입 가능</button>
                <button class="test-btn" onclick="startScan(false)">테스트: 반입 불가</button>
            </div>
        </div>

        <!-- [화면 3] 판독 로딩 -->
        <div id="screen-loading" class="screen">
            <div class="loader"></div>
            <div class="main-title" style="font-size: 28px;">배터리 규정을 확인하고 있습니다...</div>
        </div>

        <!-- [화면 4] 결과: 합격 (규정 맞음) -->
        <div id="screen-pass" class="screen">
            <div class="result-box">
                <div class="main-title" style="color: #34d399;">이 배터리는 규정에 맞습니다.</div>
                <div style="font-size: 20px; color: #cbd5e1; font-weight: 500; line-height: 1.5;">
                    스티커를 배터리에 붙여주시고<br>파우치에 넣어주세요.
                </div>
                <span class="action-info">기기 하단에서 파우치와 스티커가 배출되었습니다.</span>
            </div>
            <button class="home-btn" onclick="showScreen('screen-welcome')">처음으로 돌아가기</button>
        </div>

        <!-- [화면 5] 결과: 불합격 (위탁 서비스 유도) -->
        <div id="screen-fail" class="screen">
            <div class="result-box">
                <div class="main-title" style="color: #f87171;">이 배터리는 기내에 반입할 수 없습니다.</div>
                <div style="font-size: 20px; color: #cbd5e1; font-weight: 500; line-height: 1.5;">
                    보관함이나 위탁서비스를 이용해주세요.
                </div>
            </div>
            <div class="action-btns">
                <button class="home-btn" onclick="showScreen('screen-welcome')">처음으로</button>
                <button class="consignment-btn" onclick="goToConsignment()">위탁서비스 이용하기</button>
            </div>
        </div>

    </div>

    <script>
        function showScreen(screenId) {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => screen.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function selectAirline(airlineName) {
            document.getElementById('display-airline').innerText = airlineName;
            showScreen('screen-battery');
        }

        function startScan(isPass) {
            showScreen('screen-loading');

            setTimeout(() => {
                if (isPass) {
                    showScreen('screen-pass');
                } else {
                    showScreen('screen-fail');
                }
            }, 2500);
        }

        function goToConsignment() {
            alert("물품 보관 및 위탁 서비스 접수 화면으로 이동합니다.");
            showScreen('screen-welcome');
        }
    </script>

</body>
</html>
