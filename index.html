<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면에서도 꽉 차게 보이도록 하는 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Pass : Pack-Free Bot</title>
    <style>
        /* 외부 폰트 대신 모든 기기에 기본 설치된 깔끔한 폰트 사용 (오류 방지) */
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .kiosk-container {
            width: 90%;
            max-width: 900px;
            background-color: #16213e;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .header {
            border-bottom: 2px solid #0f3460;
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #00d2ff;
            margin: 0;
            font-size: 32px;
        }

        #time-display {
            color: #a3a3a3;
            margin-top: 10px;
            font-size: 18px;
        }

        .instruction {
            font-size: 36px;
            font-weight: bold;
            color: #e94560;
            margin-bottom: 15px;
        }

        .sub-instruction {
            font-size: 22px;
            color: #e0e0e0;
            margin-bottom: 40px;
        }

        /* 버튼들이 화면 크기에 맞춰 알아서 줄바꿈 되도록 설정 */
        .airline-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .airline-btn {
            background-color: #0f3460;
            border: 2px solid #00d2ff;
            border-radius: 12px;
            padding: 25px 30px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            width: 200px;
            transition: 0.2s;
        }

        .airline-btn:hover, .airline-btn:active {
            background-color: #00d2ff;
            color: #1a1a2e;
        }

        #loading-screen, #result-screen {
            display: none; /* 처음에는 숨겨둠 */
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 7px solid #0f3460;
            border-top: 7px solid #00d2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px auto;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        .result-title {
            font-size: 40px;
            font-weight: bold;
            color: #00d2ff;
            margin-bottom: 25px;
        }

        .result-desc {
            font-size: 26px;
            line-height: 1.5;
            background: #0f3460;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 40px;
        }

        .action-btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            background-color: #ff5c77;
        }
    </style>
</head>
<body>

    <div class="kiosk-container">
        <!-- 1. 공통 헤더 -->
        <div class="header">
            <h1>Pre-Pass : Pack-Free Bot</h1>
            <div id="time-display"></div>
        </div>

        <!-- 2. 기본 화면 (항공사 선택) -->
        <div id="home-screen">
            <div class="instruction">보조배터리를 올려주세요</div>
            <div class="sub-instruction">판독을 위해 이용하실 항공사를 선택해주세요</div>
            
            <div class="airline-grid">
                <button class="airline-btn" onclick="startScan('대한항공')">대한항공</button>
                <button class="airline-btn" onclick="startScan('아시아나항공')">아시아나항공</button>
                <button class="airline-btn" onclick="startScan('제주항공')">제주항공</button>
                <button class="airline-btn" onclick="startScan('진에어')">진에어</button>
            </div>
        </div>

        <!-- 3. 로딩 화면 -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <div class="instruction" id="loading-text">판독 중...</div>
            <div class="sub-instruction">AI가 배터리 규격을 확인하고 있습니다</div>
        </div>

        <!-- 4. 결과 화면 -->
        <div id="result-screen">
            <div class="result-title">✔ 반입 가능 (조치 필요)</div>
            <div class="result-desc">
                <strong>[단자 노출 감지]</strong><br>
                절연테이프 부착이 필요합니다.<br>
                <span style="font-size: 18px; color: #a3a3a3; display: block; margin-top: 15px;">(기기 하단에서 배출된 테이프를 단자 위에 붙여주세요)</span>
            </div>
            <button class="action-btn" onclick="issuePass()">디지털 검증 패스 받기</button>
        </div>
    </div>

    <script>
        // 1. 현재 시간 표시 기능
        function updateTime() {
            const now = new Date();
            document.getElementById('time-display').innerText = now.toLocaleString('ko-KR');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 2. 항공사 버튼 클릭 시 작동하는 스캔 기능
        function startScan(airline) {
            // 메인 화면 숨기고 로딩 화면 띄우기
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'block';
            
            // 선택한 항공사 이름 화면에 반영
            document.getElementById('loading-text').innerText = airline
