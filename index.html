<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Pass : Pack-Free Bot</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .kiosk-container {
            width: 90%;
            max-width: 900px;
            background-color: #16213e;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }

        /* 모든 화면을 기본적으로 숨김 처리 */
        .screen {
            display: none;
        }

        /* 활성화된 화면만 보여줌 */
        .screen.active {
            display: block;
        }

        .title-text {
            font-size: 38px;
            font-weight: bold;
            color: #00d2ff;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .sub-text {
            font-size: 24px;
            color: #e0e0e0;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* 1. 시작 버튼 */
        .start-btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 25px 60px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
        }
        .start-btn:hover { background-color: #ff5c77; transform: scale(1.05); }

        /* 2. 항공사 버튼 그리드 */
        .airline-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .airline-btn {
            background-color: #0f3460;
            border: 2px solid #00d2ff;
            border-radius: 12px;
            padding: 20px 30px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            width: 200px;
            transition: 0.2s;
        }
        .airline-btn:hover { background-color: #00d2ff; color: #1a1a2e; }

        .barcode-box {
            background-color: rgba(255,255,255,0.05);
            border: 2px dashed #a3a3a3;
            border-radius: 15px;
            padding: 20px;
            color: #a3a3a3;
            font-size: 20px;
            margin: 0 auto;
            width: 60%;
        }

        /* 3. 배터리 테스트 버튼 */
        .test-btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .test-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
        }
        .test-btn.fail { background-color: #f44336; }

        /* 선택된 항공사 표시 라벨 */
        .selected-airline-label {
            display: inline-block;
            background-color: #00d2ff;
            color: #1a1a2e;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* 로딩 스피너 */
        .spinner {
            width: 70px;
            height: 70px;
            border: 7px solid #0f3460;
            border-top: 7px solid #00d2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 결과 화면 공통 */
        .result-box {
            background: #0f3460;
            padding: 40px 30px;
            border-radius: 15px;
            margin-bottom: 40px;
        }
        .result-box.pass { border: 3px solid #00d2ff; }
        .result-box.fail { border: 3px solid #e94560; }
        
        .action-info {
            color: #a3a3a3;
            font-size: 20px;
            margin-top: 20px;
            display: block;
        }

        .home-btn {
            background-color: transparent;
            color: #a3a3a3;
            border: 2px solid #a3a3a3;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="kiosk-container">

        <!-- [화면 1] 인사말 및 시작 -->
        <div id="screen-welcome" class="screen active">
            <div class="title-text">안녕하세요.<br>보조배터리 반입 확인 로봇입니다.</div>
            <button class="start-btn" onclick="showScreen('screen-airline')">시작하기</button>
        </div>

        <!-- [화면 2] 항공사 선택 및 바코드 인식 -->
        <div id="screen-airline" class="screen">
            <div class="title-text">항공사 선택하기 또는<br>아래 바코드 인식란에 티켓을 인식해주세요.</div>
            
            <div class="airline-grid">
                <button class="airline-btn" onclick="selectAirline('대한항공')">대한항공</button>
                <button class="airline-btn" onclick="selectAirline('아시아나항공')">아시아나항공</button>
                <button class="airline-btn" onclick="selectAirline('제주항공')">제주항공</button>
                <button class="airline-btn" onclick="selectAirline('진에어')">진에어</button>
            </div>

            <div class="barcode-box">
                [ 🎫 탑승권 바코드 스캔 영역 ]
            </div>
        </div>

        <!-- [화면 3] 배터리 올리기 -->
        <div id="screen-battery" class="screen">
            <div class="selected-airline-label" id="display-airline">OO항공</div>
            <div class="title-text" style="font-size: 42px;">아래에 보조배터리를 올려주세요.</div>
            
            <!-- 발표 시연용 컨트롤 버튼 (실제 로봇은 센서로 작동하지만, 데모를 위해 버튼 클릭) -->
            <div class="test-btn-group">
                <button class="test-btn" onclick="startScan(true)">테스트: 규정 맞음(합격) 센서 인식</button>
                <button class="test-btn fail" onclick="startScan(false)">테스트: 규정 초과(불합격) 센서 인식</button>
            </div>
        </div>

        <!-- [화면 4] 판독 로딩 -->
        <div id="screen-loading" class="screen">
            <div class="spinner"></div>
            <div class="title-text">배터리 규정을 확인하고 있습니다...</div>
        </div>

        <!-- [화면 5] 결과: 합격 (규정 맞음) -->
        <div id="screen-pass" class="screen">
            <div class="result-box pass">
                <div class="title-text" style="color: #00d2ff;">이 배터리는 규정에 맞습니다.</div>
                <div class="sub-text" style="margin-bottom: 0;">
                    디지털 검증패스 QR을 배터리에 붙여주시고<br>지퍼백에 넣어주세요.
                </div>
                <span class="action-info">(기기에서 지퍼백과 QR 스티커 배출 중...)</span>
            </div>
            <button class="home-btn" onclick="showScreen('screen-welcome')">처음으로 돌아가기</button>
        </div>

        <!-- [화면 6] 결과: 불합격 (규정 위반) -->
        <div id="screen-fail" class="screen">
            <div class="result-box fail">
                <div class="title-text" style="color: #e94560;">이 배터리는 기내에 반입할 수 없습니다.</div>
                <div class="sub-text" style="margin-bottom: 0;">
                    보관함이나 위탁서비스를 이용해주세요.
                </div>
                <span class="action-info">(화면 하단 위탁 서비스 안내 연동)</span>
            </div>
            <button class="home-btn" onclick="showScreen('screen-welcome')">처음으로 돌아가기</button>
        </div>

    </div>

    <script>
        // 특정 화면만 보여주는 공통 함수
        function showScreen(screenId) {
            // 모든 스크린에서 active 클래스 제거 (숨김)
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => screen.classList.remove('active'));
            
            // 요청한 스크린에만 active 클래스 추가 (보여줌)
            document.getElementById(screenId).classList.add('active');
        }

        // 항공사 선택 완료 시
        function selectAirline(airlineName) {
            document.getElementById('display-airline').innerText = airlineName;
            showScreen('screen-battery');
        }

        // 배터리를 올려두었을 때 (시연용 버튼 클릭 시 작동)
        function startScan(isPass) {
            showScreen('screen-loading');

            // 2.5초 뒤에 결과 화면 표시
            setTimeout(() => {
                if (isPass === true) {
                    showScreen('screen-pass'); // 규정에 맞음
                } else {
                    showScreen('screen-fail'); // 반입 불가
                }
            }, 2500);
        }
    </script>

</body>
</html>
