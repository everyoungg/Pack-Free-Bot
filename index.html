<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Pass : Pack-Free Bot</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #f0f8ff 0%, #e1f5fe 50%, #b3e5fc 100%);
            color: #01579b;
            font-family: 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .kiosk-container {
            width: 90%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 35px;
            padding: 50px 40px;
            box-shadow: 0 30px 60px rgba(2, 119, 189, 0.08), 
                        inset 0 0 20px rgba(255, 255, 255, 0.5);
            text-align: center;
            position: relative;
        }

        .screen { display: none; opacity: 0; }
        .screen.active { 
            display: block; 
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 이미지 레퍼런스에 맞춘 메인 타이틀 및 서브 타이틀 스타일 */
        .main-title {
            font-size: 44px;
            font-weight: 800;
            color: #0277bd;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        .sub-title {
            font-size: 24px;
            font-weight: 700;
            color: #0288d1;
            margin-bottom: 20px;
        }

        /* 항공사 및 바코드 아이콘 버튼 컨테이너 */
        .icon-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #81d4fa;
            border-radius: 16px;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 600;
            color: #0277bd;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 110px;
            height: 110px;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(3, 169, 244, 0.1);
        }

        .icon-btn span {
            font-size: 15px;
        }

        .icon-btn svg {
            width: 32px;
            height: 32px;
            fill: #0277bd;
        }

        .icon-btn:hover { 
            background: linear-gradient(135deg, #4fc3f7 0%, #03a9f4 100%);
            color: white;
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(3, 169, 244, 0.25);
        }

        .icon-btn:hover svg {
            fill: white;
        }

        /* 실시간 카메라 바코드 스캔 영역 */
        .camera-container {
            position: relative;
            width: 260px;
            height: 160px;
            margin: 0 auto;
            background: #e1f5fe;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #81d4fa;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .viewfinder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            height: 55%;
            border: 2px dashed rgba(2, 119, 189, 0.6);
            border-radius: 10px;
            pointer-events: none;
        }
        .camera-guide {
            position: absolute;
            bottom: 8px;
            width: 100%;
            color: #01579b;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.85);
            padding: 3px 0;
            z-index: 2;
        }

        /* 시연용 테스트 버튼 */
        .test-btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
        }
        .test-btn {
            background: rgba(255, 255, 255, 0.7);
            color: #0288d1;
            border: 1.5px solid #4fc3f7;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .test-btn:hover { background: #e1f5fe; border-color: #0277bd; }

        .selected-airline-label {
            display: inline-block;
            background: linear-gradient(135deg, #e1f5fe 0%, #b3e5fc 100%);
            color: #01579b;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(2, 119, 189, 0.08);
        }

        /* 로딩 스피너 */
        .loader {
            width: 75px;
            height: 75px;
            border: 4px solid rgba(129, 212, 250, 0.3);
            border-top: 4px solid #03a9f4;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin: 0 auto 30px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .result-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 45px 35px;
            border-radius: 24px;
            margin-bottom: 35px;
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 20px 40px rgba(2, 119, 189, 0.05);
        }
        
        .action-info {
            color: #0288d1;
            font-size: 17px;
            margin-top: 20px;
            display: block;
            opacity: 0.8;
            font-weight: 500;
        }

        .action-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .home-btn, .consignment-btn {
            background: transparent;
            color: #0277bd;
            border: 2px solid #81d4fa;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .home-btn:hover { background: rgba(129, 212, 250, 0.1); }
        
        .consignment-btn {
            background: linear-gradient(135deg, #4fc3f7 0%, #0288d1 100%);
            color: white;
            border: none;
            box-shadow: 0 10px 20px rgba(2, 136, 209, 0.2);
        }
        .consignment-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(2, 136, 209, 0.3); }
    </style>
</head>
<body>

    <div class="kiosk-container">

        <!-- [화면 1] 이미지 레퍼런스 맞춤 첫 화면: 보조배터리를 올려주세요 & 항공사를 선택해주세요 -->
        <div id="screen-welcome" class="screen active">
            <div class="main-title">보조배터리를 올려주세요</div>
            <div class="sub-title">항공사를 선택해주세요</div>
            
            <div class="icon-grid">
                <button class="icon-btn" onclick="selectAirline('대한항공')">
                    <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                    <span>대한항공</span>
                </button>
                <button class="icon-btn" onclick="selectAirline('아시아나항공')">
                    <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                    <span>아시아나</span>
                </button>
                <button class="icon-btn" onclick="selectAirline('제주항공')">
                    <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                    <span>제주항공</span>
                </button>
                <button class="icon-btn" onclick="selectAirline('진에어')">
                    <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                    <span>진에어</span>
                </button>
                <button class="icon-btn" onclick="selectAirline('티켓 스캔')">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                    <span>티켓 바코드</span>
                </button>
            </div>

            <!-- 카메라 바코드 스캔 영역 -->
            <div class="camera-container">
                <video id="camera-feed" autoplay playsinline></video>
                <div class="viewfinder"></div>
                <div class="camera-guide">티켓 바코드를 비춰주세요</div>
            </div>
        </div>

        <!-- [화면 2] 배터리 규정 판독 대기 -->
        <div id="screen-battery" class="screen">
            <div class="selected-airline-label" id="display-airline">OO항공</div>
            <div class="main-title" style="font-size: 36px;">배터리를 스캔하고 있습니다.</div>
            <div class="sub-title">잠시만 기다려주세요.</div>
            
            <!-- 시연용 테스트 버튼 -->
            <div class="test-btn-group">
                <button class="test-btn" onclick="startScan(true)">테스트: 반입 가능</button>
                <button class="test-btn" onclick="startScan(false)">테스트: 반입 불가</button>
            </div>
        </div>

        <!-- [화면 3] 판독 로딩 -->
        <div id="screen-loading" class="screen">
            <div class="loader"></div>
            <div class="main-title" style="font-size: 30px;">배터리 규정을 확인하고 있습니다...</div>
            <div class="sub-title">잠시만 기다려주세요.</div>
        </div>

        <!-- [화면 4] 결과: 합격 (규정 맞음) -->
        <div id="screen-pass" class="screen">
            <div class="result-box">
                <div class="main-title">이 배터리는 규정에 맞습니다.</div>
                <div class="sub-title" style="margin-bottom: 0;">
                    스티커를 배터리에 붙여주시고<br>파우치에 넣어주세요.
                </div>
                <span class="action-info">기기 하단에서 파우치와 스티커가 배출되었습니다.</span>
            </div>
            <button class="home-btn" onclick="showScreen('screen-welcome')">처음으로 돌아가기</button>
        </div>

        <!-- [화면 5] 결과: 불합격 (위탁 서비스 유도) -->
        <div id="screen-fail" class="screen">
            <div class="result-box">
                <div class="main-title">이 배터리는 기내에 반입할 수 없습니다.</div>
                <div class="sub-title" style="margin-bottom: 0;">
                    보관함이나 위탁서비스를 이용해주세요.
                </div>
            </div>
            <div class="action-btns">
                <button class="home-btn" onclick="showScreen('screen-welcome')">처음으로</button>
                <button class="consignment-btn" onclick="goToConsignment()">위탁서비스 이용하기</button>
            </div>
        </div>

    </div>

    <script>
        let cameraStream = null;

        function showScreen(screenId) {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => screen.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            if (screenId === 'screen-welcome') {
                startCamera();
            } else {
                stopCamera(); 
            }
        }

        async function startCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('camera-feed').srcObject = cameraStream;
            } catch (err) {
                console.error("카메라 접근 불가:", err);
                document.querySelector('.camera-guide').innerText = "카메라 권한을 허용해주세요.";
            }
        }

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
        }

        function selectAirline(airlineName) {
            document.getElementById('display-airline').innerText = airlineName;
            showScreen('screen-battery');
        }

        function startScan(isPass) {
            showScreen('screen-loading');

            setTimeout(() => {
                if (isPass) {
                    showScreen('screen-pass');
                } else {
                    showScreen('screen-fail');
                }
            }, 2500);
        }

        function goToConsignment() {
            alert("물품 보관 및 위탁 서비스 접수 화면으로 이동합니다.");
            showScreen('screen-welcome');
        }

        window.onload = function() {
            startCamera();
        };
    </script>

</body>
</html>
